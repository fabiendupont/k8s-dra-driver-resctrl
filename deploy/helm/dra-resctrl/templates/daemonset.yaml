apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dra-resctrl.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dra-resctrl.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "dra-resctrl.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "dra-resctrl.selectorLabels" . | nindent 8 }}
        {{- with .Values.driver.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.driver.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dra-resctrl.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.driver.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: driver
          image: {{ include "dra-resctrl.image" . }}
          imagePullPolicy: {{ .Values.driver.image.pullPolicy }}
          args:
            - --node-name=$(NODE_NAME)
            {{- if .Values.driver.partitionSizes }}
            - --partition-sizes={{ .Values.driver.partitionSizes }}
            {{- else }}
            - --partition-count={{ .Values.driver.partitionCount }}
            {{- end }}
            - --resctrl-root={{ .Values.driver.resctrlRoot }}
            - --health-port={{ .Values.driver.healthPort }}
            {{- if gt (int .Values.driver.mbaBandwidth) 0 }}
            - --mba-bandwidth={{ .Values.driver.mbaBandwidth }}
            {{- end }}
            {{- if gt (int .Values.driver.smbaBandwidth) 0 }}
            - --smba-bandwidth={{ .Values.driver.smbaBandwidth }}
            {{- end }}
            - --monitor-interval={{ .Values.driver.monitorInterval }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: {{ .Values.driver.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.driver.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: cdi
              mountPath: /var/run/cdi
            - name: resctrl
              mountPath: {{ .Values.driver.resctrlRoot }}
      {{- with .Values.driver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.driver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.driver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: resctrl
          hostPath:
            path: {{ .Values.driver.resctrlRoot }}
