apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-resctrl
  namespace: dra-resctrl
spec:
  selector:
    matchLabels:
      app: dra-resctrl
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: dra-resctrl
    spec:
      serviceAccountName: dra-resctrl
      terminationGracePeriodSeconds: 60
      nodeSelector:
        resctrl.fabiendupont.io/resctrl-cat: "true"
      containers:
        - name: driver
          image: ghcr.io/fabiendupont/dra-resctrl:latest
          args:
            - --node-name=$(NODE_NAME)
            - --partition-count=4
            - --health-port=8081
            # --partition-sizes=2:4,4:2  # heterogeneous sizes (ways:count,...); omit to use --partition-count
            # --mba-bandwidth=70   # MBA throttle (percent or MBps); auto-detected mode
            # --smba-bandwidth=50  # Slow-memory bandwidth throttle (HBM systems only)
            # --monitor-interval=10s  # CMT/MBM scrape interval
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: cdi
              mountPath: /var/run/cdi
            - name: resctrl
              mountPath: /sys/fs/resctrl
      volumes:
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: resctrl
          hostPath:
            path: /sys/fs/resctrl
