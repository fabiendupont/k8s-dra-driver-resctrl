apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-partition-topology-rule
  namespace: dra-resctrl
  labels:
    nodepartition.dra.k8s.io/topology-rule: "true"
data:
  # Topology rule for the cache-partition driver.
  # The coordinator uses cacheGroupID to co-locate claims from this driver
  # with claims from other DRA drivers (e.g. k8s-dra-driver-time-share)
  # that expose the same integer attribute for the same physical L3 domain.
  attribute: "resctrl.fabiendupont.io/cacheGroupID"
  type: "int"
  driver: "resctrl.fabiendupont.io"
  mapsTo: ""
  partitioning: "group"
  constraint: "match"
  enforcement: "required"
  description: "L3 cache domain ID — matches across drivers sharing the same physical cache"
