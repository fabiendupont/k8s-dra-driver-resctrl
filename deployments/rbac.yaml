apiVersion: v1
kind: Namespace
metadata:
  name: dra-resctrl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dra-resctrl
  namespace: dra-resctrl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-resctrl
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dra-resctrl
subjects:
  - kind: ServiceAccount
    name: dra-resctrl
    namespace: dra-resctrl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dra-resctrl
